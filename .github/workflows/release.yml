name: Build and release Linux packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      debian: ${{ steps.version.outputs.debian }}
      rpm: ${{ steps.version.outputs.rpm }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 scripts/release-version.py --tag "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "debian=$(python3 scripts/release-version.py --debian)" >> "$GITHUB_OUTPUT"
          echo "rpm=$(python3 scripts/release-version.py --rpm)" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo 'prerelease=true' >> "$GITHUB_OUTPUT";; *) echo 'prerelease=false' >> "$GITHUB_OUTPUT";; esac
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - name: Prepare shared CI inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs unzip curl
          command -v sdkmanager >/dev/null
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-23'
          sudo mkdir -p /usr/lib/android-sdk/platforms/android-23
          sudo ln -sf "$ANDROID_HOME/platforms/android-23/android.jar" /usr/lib/android-sdk/platforms/android-23/android.jar
          sh scripts/prepare-ci-inputs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shared-ci-inputs
          path: |
            target/tools/r8-8.3.37.jar
            target/native/init.waydroid.rc
            target/native/framework-res.apk
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: {package: [deb, rpm, pkg]}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: shared-ci-inputs, path: .}
      - name: Restore shared input paths
        run: |
          mkdir -p target/tools target/native
          test -s tools/r8-8.3.37.jar
          test -s native/init.waydroid.rc
          test -s native/framework-res.apk
          cp tools/r8-8.3.37.jar target/tools/r8-8.3.37.jar
          cp native/init.waydroid.rc target/native/init.waydroid.rc
          cp native/framework-res.apk target/native/framework-res.apk
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev \
            clang lld aapt apksigner patchelf rpm zstd
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - name: Install Android API 23
        run: |
          sdkmanager 'platforms;android-23'
          sudo mkdir -p /usr/lib/android-sdk/platforms/android-23
          sudo ln -sf "$ANDROID_HOME/platforms/android-23/android.jar" /usr/lib/android-sdk/platforms/android-23/android.jar
      - name: Build selected package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DEBIAN_VERSION: ${{ needs.prepare.outputs.debian }}
          RPM_VERSION: ${{ needs.prepare.outputs.rpm }}
          PACKAGE: ${{ matrix.package }}
        run: |
          case "$PACKAGE" in
            deb) sh scripts/build-deb.sh "$DEBIAN_VERSION"; file="target/releases/anvildroid-controller_${DEBIAN_VERSION}_amd64.deb";;
            rpm) sh scripts/build-rpm.sh "$RPM_VERSION"; file="target/releases/anvildroid-controller-${RPM_VERSION}-1.x86_64.rpm";;
            pkg) sh scripts/build-pkg.sh "$VERSION"; file="target/releases/anvildroid-controller-${VERSION}-1-x86_64.pkg.tar.zst";;
            *) exit 2;;
          esac
          test -s "$file"
          missing=$(ldd target/release/anvildroid-gui | sed -n '/not found/p')
          test -z "$missing" || { echo "$missing" >&2; exit 1; }
          printf '%s\n' "$file" > package-path.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-${{ matrix.package }}
          path: |
            target/releases/*.deb
            target/releases/*.rpm
            target/releases/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-package-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          cd release
          sha256sum ./*.deb ./*.rpm ./*.pkg.tar.zst > SHA256SUMS
          sha256sum --check SHA256SUMS
          args=(--verify-tag --title "AnvilDroid $RELEASE_VERSION" --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" ./*.deb ./*.rpm ./*.pkg.tar.zst SHA256SUMS
