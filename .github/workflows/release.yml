name: Build and release Linux packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      debian: ${{ steps.version.outputs.debian }}
      rpm: ${{ steps.version.outputs.rpm }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/release-version.py --tag "$RELEASE_TAG" >/dev/null
          fi
          version=$(python3 scripts/release-version.py)
          {
            echo "version=$version"
            echo "debian=$(python3 scripts/release-version.py --debian)"
            echo "rpm=$(python3 scripts/release-version.py --rpm)"
            case "$version" in *-*) echo 'prerelease=true';; *) echo 'prerelease=false';; esac
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install runtime feature test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libx11-dev
      - name: Test runtime features without Android
        run: sh scripts/test-runtime-features.sh
      - name: Test shared folders in a private PID1 mount namespace
        run: sudo python3 services/shares-test.py --mount-test
      - name: Test Default shared-folder lifecycle in a private PID1 mount namespace
        run: sudo python3 services/default-shares-test.py --mount-test
      - name: Test Default native thread pools across private mount namespaces
        run: sudo python3 services/default-native-pool-test.py --mount-test
      - name: Test sharing ownership and ACLs with two real desktop UIDs
        run: sudo python3 services/share-identities-test.py --mount-test
      - name: Test Android overlays in a private PID1 mount namespace
        run: sudo python3 services/overlay-test.py --mount-test
      - name: Test Android FUSE sharing and existing slave namespaces
        run: sudo python3 services/shares-fuse-test.py --mount-test
      - name: Test preparation without initialized Waydroid host
        run: python3 services/provision-support-test.py
      - name: Test legacy Debian installation permissions
        run: python3 services/install-permissions-test.py
      - name: Test Default Binder, NVIDIA session devices and shader warm-up
        run: |
          python3 services/default-gpu-test.py
          python3 services/default-binder-test.py
          python3 services/surfaceflinger-cache-test.py
      - name: Test confirmed app removal without Android
        run: |
          python3 services/default-apps-test.py
          node crates/anvildroid-gui/uninstall-check.cjs
      - name: Test task snapshot notifications and atomic publication
        run: |
          cc -Wall -Wextra -Werror native/bridge/task-watch-test.c -o /tmp/anvildroid-task-watch-check
          /tmp/anvildroid-task-watch-check
          python3 native/bridge/display-size-shell-test.py
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - name: Prepare shared CI inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs unzip curl patch \
            build-essential pkg-config git cmake flex bison libssl-dev libjsoncpp-dev \
            libxcb1-dev libx11-dev libvulkan-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri libxkbcommon-dev libxcursor-dev libxi-dev libxfixes-dev libxext-dev libxtst-dev xvfb xauth xclip aapt apksigner
          command -v sdkmanager >/dev/null
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-23' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.3.11579264'
          sudo ln -s "$ANDROID_HOME/ndk/26.3.11579264" /opt/android-ndk
          sudo mkdir -p /usr/lib/android-sdk/platforms/android-23
          sudo ln -sf "$ANDROID_HOME/platforms/android-23/android.jar" /usr/lib/android-sdk/platforms/android-23/android.jar
          sh scripts/prepare-ci-inputs.sh
          sh scripts/prepare-scrcpy.sh
      - name: Build pinned native X11 payload
        run: |
          python3 scripts/build-x11-payload.py
      - name: Test native X11 protocols without a display
        run: python3 native/x11/host-check.py
      - name: Test native X11 input through a private software display
        run: python3 native/x11/host-check.py --software-x11
      - name: Prepare pinned NVIDIA archives
        env:
          GH_TOKEN: ${{ secrets.NVIDIA_ARTIFACT_TOKEN || github.token }}
        run: python3 scripts/prepare-nvidia-fork.py --download
      - uses: actions/upload-artifact@v4
        with:
          name: shared-ci-inputs
          path: |
            target/tools/r8-8.3.37.jar
            target/native/init.waydroid.rc
            target/native/framework-res.apk
            target/tools/nvidia/*.tar.gz
            target/native-x11/package/
            target/input-diagnostic/scrcpy-server-cancel.jar
            target/input-diagnostic/scrcpy-LICENSE
            target/input-diagnostic/scrcpy-build.json
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: {package: [deb, rpm, pkg]}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: shared-ci-inputs, path: .}
      - name: Restore shared input paths
        run: |
          mkdir -p target/tools target/native target/input-diagnostic
          test -s tools/r8-8.3.37.jar
          test -s native/init.waydroid.rc
          test -s native/framework-res.apk
          cp tools/r8-8.3.37.jar target/tools/r8-8.3.37.jar
          cp native/init.waydroid.rc target/native/init.waydroid.rc
          cp native/framework-res.apk target/native/framework-res.apk
          test -d tools/nvidia
          cp -a tools/nvidia target/tools/nvidia
          mkdir -p target/native-x11
          cp -a native-x11/package target/native-x11/package
          cp input-diagnostic/scrcpy-server-cancel.jar input-diagnostic/scrcpy-LICENSE input-diagnostic/scrcpy-build.json target/input-diagnostic/
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libwayland-dev \
            clang lld aapt apksigner patchelf rpm zstd cpio
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - name: Install Android APIs and image tools
        run: |
          sdkmanager 'platforms;android-23' 'build-tools;35.0.0'
          sudo mkdir -p /usr/lib/android-sdk/platforms/android-23
          sudo ln -sf "$ANDROID_HOME/platforms/android-23/android.jar" /usr/lib/android-sdk/platforms/android-23/android.jar
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Check Rust warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build selected package
        env:
          ANVILDROID_X11_PAYLOAD: ${{ github.workspace }}/target/native-x11/package
          VERSION: ${{ needs.prepare.outputs.version }}
          DEBIAN_VERSION: ${{ needs.prepare.outputs.debian }}
          RPM_VERSION: ${{ needs.prepare.outputs.rpm }}
          PACKAGE: ${{ matrix.package }}
        run: |
          case "$PACKAGE" in
            deb) sh scripts/build-deb.sh "$DEBIAN_VERSION"; file="target/releases/anvildroid-controller_${DEBIAN_VERSION}_amd64.deb";;
            rpm) sh scripts/build-rpm.sh "$RPM_VERSION"; file="target/releases/anvildroid-controller-${RPM_VERSION}-1.x86_64.rpm";;
            pkg) sh scripts/build-pkg.sh "$VERSION"; file="target/releases/anvildroid-controller-${VERSION}-1-x86_64.pkg.tar.zst";;
            *) exit 2;;
          esac
          test -s "$file"
          python3 scripts/verify-package.py "$file"
          printf '%s\n' "$file" > package-path.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-${{ matrix.package }}
          path: |
            target/releases/*.deb
            target/releases/*.rpm
            target/releases/*.pkg.tar.zst
          if-no-files-found: error

  smoke:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: deb, image: 'ubuntu:24.04'}
          - {package: rpm, image: 'fedora:43'}
          - {package: pkg, image: 'archlinux:base'}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: linux-package-${{ matrix.package }}
          path: target/releases
      - name: Install, run GUI/CLI and remove package
        env:
          PACKAGE: ${{ matrix.package }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          case "$PACKAGE" in
            deb) file="anvildroid-controller_$(python3 scripts/release-version.py --debian)_amd64.deb";;
            rpm) file="anvildroid-controller-$(python3 scripts/release-version.py --rpm)-1.x86_64.rpm";;
            pkg) file="anvildroid-controller-${VERSION}-1-x86_64.pkg.tar.zst";;
            *) exit 2;;
          esac
          docker run --rm \
            -v "$PWD/scripts/verify-package.py:/work/scripts/verify-package.py:ro" \
            -v "$PWD/scripts/verify-package-install.sh:/work/scripts/verify-package-install.sh:ro" \
            -v "$PWD/target/releases/$file:/packages/$file:ro" "$IMAGE" \
            sh /work/scripts/verify-package-install.sh "$PACKAGE" "/packages/$file" "$VERSION"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build, smoke]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-package-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          cd release
          sha256sum ./*.deb ./*.rpm ./*.pkg.tar.zst > SHA256SUMS
          sha256sum --check SHA256SUMS
          args=(--verify-tag --title "AnvilDroid $RELEASE_VERSION" --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" ./*.deb ./*.rpm ./*.pkg.tar.zst SHA256SUMS
