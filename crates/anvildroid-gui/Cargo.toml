[package]
name = "anvildroid-gui"
version.workspace = true
license.workspace = true
edition = "2021"
description = "AnvilDroid GUI — Tauri desktop application"
publish = false

[[bin]]
name = "anvildroid-gui"
path = "src/main.rs"

[dependencies]
anvildroid-core = { path = "../anvildroid-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }
